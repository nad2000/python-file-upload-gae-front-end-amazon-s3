#application: python-file-upload-gae-front-end-amazon-s3
application: pyfileupload2s3
version: 1
runtime: python
api_version: 1

handlers:

- url: /js
  static_dir: js

- url: /css
  static_dir: css

- url: /stylesheets
  static_dir: css

- url: /favicon.ico
  static_files: favicon.ico
  upload: favicon.ico

- url: /.*
  script: app.py
